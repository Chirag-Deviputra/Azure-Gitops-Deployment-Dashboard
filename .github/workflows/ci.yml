name: Test and release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: pytest backend/tests
        env:
          PYTHONPATH: backend

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4.3.1
        with:
          version: v3.17.3
      - run: helm lint helm/gitops-dashboard
      - run: helm template gitops-dashboard helm/gitops-dashboard --namespace gitops-dev
      - run: helm template gitops-dashboard helm/gitops-dashboard --namespace gitops-dev --set monitoring.enabled=true --set ingress.enabled=true --set ingress.host=dashboard.example.com --set ingress.tlsSecretName=dashboard-tls

  images:
    needs: [frontend, backend, manifests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - component: frontend
            context: .
          - component: backend
            context: backend
    steps:
      - uses: actions/checkout@v7
      - name: Set image repository
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/gitops-dashboard-${{ matrix.component }}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:dev
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  promote:
    needs: images
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Commit tested image versions
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          # Do not promote an older build over a newer source commit.
          if [ "$(git rev-parse HEAD)" != "$RELEASE_SHA" ]; then
            echo "main has advanced; the newer workflow will promote its images."
            exit 0
          fi
          python scripts/promote-images.py "$RELEASE_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add helm/gitops-dashboard/values.yaml
          git diff --cached --quiet && exit 0
          git commit -m "Deploy tested images ${RELEASE_SHA}"
          # A non-fast-forward push fails safely if main changes during promotion.
          git push origin HEAD:main
